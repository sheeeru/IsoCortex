# =============================================================================
# IsoCortex — Docker Compose
# =============================================================================
# SRS Section 14.2: Docker Compose configuration
#
# Usage:  docker-compose up -d
#         docker-compose logs -f api
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: isocortex-api:latest
    container_name: isocortex-api
    ports:
      - "8900:8900"
    volumes:
      - isocortex-data:/home/isocortex/.isocortex
    environment:
      - ISOCORTEX_HOST=0.0.0.0
      - ISOCORTEX_PORT=8900
      - ISOCORTEX_WORKERS=1
      - ISOCORTEX_LOG_LEVEL=INFO
      - ISOCORTEX_MAX_MEMORY_MB=4096
      - ISOCORTEX_SECRET_KEY=${ISOCORTEX_SECRET_KEY:-change-me-in-production}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # Web UI (Next.js SPA)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: isocortex-web:latest
    container_name: isocortex-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8900
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  isocortex-data:
    driver: local
