# =============================================================================
# IsoCortex — pyproject.toml
# =============================================================================
# Build configuration for the IsoCortex semantic search platform.
#
# Build:  pip install -e ".[dev]"
# Run:    python -m isocortex.api
# CLI:    isocortex --help
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "isocortex"
version = "0.1.0"
description = "Production-grade local semantic search engine with HNSW indices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shaheer Qureshi", email = "shaheer@isocortex.dev"},
]
keywords = [
    "semantic-search", "hnsw", "vector-search", "embeddings",
    "sentence-transformers", "local-search", "privacy",
    "neural-retrieval", "information-retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",

    # Authentication
    "bcrypt>=4.1.0",

    # Embeddings
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "numpy>=1.24.0",

    # Document extraction
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "odfpy>=1.4.1",

    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Serialization
    "pydantic>=2.5.0",

    # Database
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
    "isort>=5.13.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
spacy = [
    "spacy>=3.7.0",
]

[project.scripts]
isocortex = "isocortex.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["isocortex*"]

[tool.setuptools.package-dir]
isocortex = "src/isocortex"
"isocortex.cli" = "cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
