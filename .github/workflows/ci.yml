name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # Python — Lint + Tests
  # =========================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ cmake libgomp1

      - name: Install Python dependencies
        working-directory: project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with ruff (if available)
        run: |
          pip install ruff 2>/dev/null || true
          ruff check project/src/ project/cli/ project/tests/ --ignore=E501 2>/dev/null || echo "Ruff not configured, skipping lint"

      - name: Run Python tests
        working-directory: project
        env:
          ISOCORTEX_DATA_DIR: /tmp/isocortex_test
          ISOCORTEX_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_cpp_hnsw.py \
            -x

  # =========================================================================
  # C++ — Compilation Check
  # =========================================================================
  cpp-build:
    name: C++ HNSW Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake

      - name: Compile C++ test harness
        working-directory: project/src/isocortex/core/hnsw
        run: |
          g++ -std=c++17 -O2 -march=native -o test_hnsw hnsw.cpp
          echo "C++ compilation successful"

      - name: Run C++ tests
        working-directory: project/src/isocortex/core/hnsw
        run: ./test_hnsw

  # =========================================================================
  # Frontend — TypeScript Check + Tests
  # =========================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: project/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci --coverage

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8900

  # =========================================================================
  # Landing Website — Build Check
  # =========================================================================
  website-build:
    name: Website Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build

  # =========================================================================
  # Docker — Build Verification
  # =========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-tests, cpp-build, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./project
          file: project/Dockerfile
          push: false
          tags: isocortex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./project/web
          file: project/web/Dockerfile
          push: false
          tags: isocortex-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
