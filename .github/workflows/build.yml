name: Build IsoCortex

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_NAME: "IsoCortex"
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────
  #  Windows Build
  # ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version string
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-$(echo ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller customtkinter Pillow numpy onnxruntime tokenizers bcrypt pymupdf python-docx python-pptx openpyxl
          pip install llama-cpp-python

      - name: Build Windows .exe
        shell: pwsh
        run: |
          pyinstaller -y `
            --name "IsoCortex" `
            --noconsole `
            --onefile `
            --icon "desktop_app/assets/app_icon.png" `
            --add-data "desktop_app/assets;desktop_app/assets" `
            --hidden-import=desktop_app `
            --hidden-import=desktop_app.main `
            --hidden-import=desktop_app.app `
            --hidden-import=desktop_app.theme `
            --hidden-import=desktop_app.engine `
            --hidden-import=desktop_app.llm `
            --hidden-import=desktop_app.workers `
            --hidden-import=desktop_app.screens `
            --hidden-import=desktop_app.screens.search `
            --hidden-import=desktop_app.screens.upload `
            --hidden-import=desktop_app.screens.indexes `
            --hidden-import=desktop_app.screens.dashboard `
            --hidden-import=desktop_app.screens.settings `
            --hidden-import=desktop_app.screens.login `
            --hidden-import=desktop_app.components `
            --hidden-import=desktop_app.components.sidebar `
            --hidden-import=desktop_app.components.toast `
            --hidden-import=sqlite3 `
            --collect-all customtkinter `
            --collect-all onnxruntime `
            --collect-all pymupdf `
            --collect-all llama_cpp `
            --collect-data tokenizers `
            --paths . `
            desktop_app/main.py

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/IsoCortex.exe -DestinationPath "IsoCortex-Windows-${{ steps.version.outputs.VERSION }}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsoCortex-Windows-${{ steps.version.outputs.VERSION }}
          path: IsoCortex-Windows-${{ steps.version.outputs.VERSION }}.zip

  # ──────────────────────────────────────────────────────────────────
  #  macOS Build
  # ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Determine version string
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-$(echo ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .icns icon from PNG
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     desktop_app/assets/app_icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     desktop_app/assets/app_icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     desktop_app/assets/app_icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     desktop_app/assets/app_icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   desktop_app/assets/app_icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   desktop_app/assets/app_icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   desktop_app/assets/app_icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   desktop_app/assets/app_icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   desktop_app/assets/app_icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 desktop_app/assets/app_icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o desktop_app/assets/app_icon.icns

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller customtkinter Pillow numpy onnxruntime tokenizers bcrypt pymupdf python-docx python-pptx openpyxl
          CMAKE_ARGS="-DLLAMA_METAL=on" pip install llama-cpp-python --no-cache-dir

      - name: Build macOS .app
        run: |
          pyinstaller -y \
            --name "IsoCortex" \
            --windowed \
            --onedir \
            --icon "desktop_app/assets/app_icon.icns" \
            --add-data "desktop_app/assets:desktop_app/assets" \
            --hidden-import=desktop_app \
            --hidden-import=desktop_app.main \
            --hidden-import=desktop_app.app \
            --hidden-import=desktop_app.theme \
            --hidden-import=desktop_app.engine \
            --hidden-import=desktop_app.llm \
            --hidden-import=desktop_app.workers \
            --hidden-import=desktop_app.screens \
            --hidden-import=desktop_app.screens.search \
            --hidden-import=desktop_app.screens.upload \
            --hidden-import=desktop_app.screens.indexes \
            --hidden-import=desktop_app.screens.dashboard \
            --hidden-import=desktop_app.screens.settings \
            --hidden-import=desktop_app.screens.login \
            --hidden-import=desktop_app.components \
            --hidden-import=desktop_app.components.sidebar \
            --hidden-import=desktop_app.components.toast \
            --hidden-import=_posixsubprocess \
            --hidden-import=sqlite3 \
            --collect-all customtkinter \
            --collect-all onnxruntime \
            --collect-all pymupdf \
            --collect-all llama_cpp \
            --collect-data tokenizers \
            --paths . \
            desktop_app/main.py

      - name: Zip macOS build
        run: cd dist && zip -r "../IsoCortex-macOS-${{ steps.version.outputs.VERSION }}.zip" IsoCortex.app/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsoCortex-macOS-${{ steps.version.outputs.VERSION }}
          path: IsoCortex-macOS-${{ steps.version.outputs.VERSION }}.zip